version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', '@axe-core/*', 'jsdom']
      tooling:
        patterns: ['eslint*', 'prettier*', 'typescript', 'husky', 'lint-staged', '@commitlint/*']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
